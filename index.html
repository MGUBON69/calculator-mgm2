<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGM2 Calculator - Evolution Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at top left, #0d1117, #05070a);
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 229, 255, 0.1), 
                        0 0 20px rgba(124, 58, 237, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Glowing accent bar at the top */
        .calculator-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00e5ff, #7c3aed, #00e5ff);
            background-size: 200% 100%;
            animation: moveGradient 4s linear infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .calculator-card h2 {
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #00e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .form-group select option {
            background-color: #0f172a;
            color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            outline: none;
            background-color: rgba(15, 23, 42, 0.9);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 28px;
            padding: 22px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-left: 4px solid #00e5ff;
            border-radius: 14px;
            display: none;
            animation: fadeInEvolution 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        @keyframes fadeInEvolution {
            from { 
                opacity: 0; 
                transform: translateY(15px) scale(0.98); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .result-box p {
            margin: 12px 0;
            color: #94a3b8;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-box span {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 15px;
        }

        .highlight {
            font-size: 16px !important;
            color: #00e5ff !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            margin-top: 16px !important;
            font-weight: 600;
        }

        .highlight span {
            font-size: 22px !important;
            color: #00e5ff !important;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>MGM2 Calculator</h2>
    
    <div class="form-group">
        <label for="carPrice">ราคารถ (บาท)</label>
        <input type="number" id="carPrice" placeholder="เช่น 649900" required>
    </div>

    <div class="form-group">
        <label for="downAmount">จำนวนเงินดาวน์ (พิมพ์ตัวเลขได้เลย)</label>
        <input type="number" id="downAmount" placeholder="เช่น 100000" required>
    </div>

    <div class="form-group">
        <label for="termMonths">ระยะเวลาผ่อน (งวด)</label>
        <select id="termMonths">
            <option value="48">48 งวด (4 ปี)</option>
            <option value="60">60 งวด (5 ปี)</option>
            <option value="72">72 งวด (6 ปี)</option>
            <option value="84">84 งวด (7 ปี)</option>
        </select>
    </div>

    <button onclick="calculateInstallment()">คำนวณค่างวดเบื้องต้น</button>

    <div class="result-box" id="resultBox">
        <p>สัดส่วนเงินดาวน์: <span id="resDownPercent">0%</span></p>
        <p>ยอดจัดไฟแนนซ์: <span id="resFinance">0.00 บาท</span></p>
        <p>อัตราดอกเบี้ยที่ใช้: <span id="resRate">0%</span></p>
        <p class="highlight" style="display:flex; justify-content:space-between; align-items:center;">
            ค่างวด: <span id="resMonthlyNoVat">0.00 บาท</span>
        </p>
    </div>
</div>

<script>
    const interestRates = {
        10: { 48: 3.69, 60: 3.99, 72: 4.39, 84: 4.59 },
        15: { 48: 3.09, 60: 3.39, 72: 3.59, 84: 4.29 },
        20: { 48: 2.69, 60: 2.89, 72: 3.29, 84: 3.99 },
        25: { 48: 2.19, 60: 2.69, 72: 3.09, 84: 3.69 }
    };

    function calculateInstallment() {
        const price = parseFloat(document.getElementById('carPrice').value);
        const downAmt = parseFloat(document.getElementById('downAmount').value);
        const termMonths = parseInt(document.getElementById('termMonths').value);

        if (isNaN(price) || price <= 0 || isNaN(downAmt) || downAmt < 0) {
            alert("คุณชินอิจิคะ กรุณาระบุราคารถและเงินดาวน์ให้ถูกต้องด้วยนะคะ 😉");
            return;
        }

        if (downAmt >= price) {
            alert("เงินดาวน์ต้องน้อยกว่าราคารถสิคะคุณชินอิจิ");
            return;
        }

        // คำนวณเปอร์เซ็นต์ดาวน์จากยอดเงินที่กรอก
        let downPercentRaw = (downAmt / price) * 100;
        let bracket = 0;

        // จัดกลุ่มเปอร์เซ็นต์ดาวน์เพื่อดึงดอกเบี้ย
        if (downPercentRaw >= 25) bracket = 25;
        else if (downPercentRaw >= 20) bracket = 20;
        else if (downPercentRaw >= 15) bracket = 15;
        else if (downPercentRaw >= 10) bracket = 10;
        else {
            const minDown = price * 0.10;
            // แสดงจุดทศนิยม 2 ตำแหน่งโดยไม่ปัดเศษทิ้ง
            alert("ดาวน์ขั้นต่ำต้อง 10% ขึ้นไปนะคะ (ประมาณ " + minDown.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาทค่ะ)");
            return;
        }

        const financeAmount = price - downAmt;
        const ratePerYear = interestRates[bracket][termMonths];
        const years = termMonths / 12;

        const totalInterest = financeAmount * (ratePerYear / 100) * years;
        
        // คำนวณค่างวดต่อเดือนแบบไม่รวม VAT และไม่มีการปัดเศษ
        const monthlyPaymentNoVat = (financeAmount + totalInterest) / termMonths;

        document.getElementById('resDownPercent').innerText = downPercentRaw.toFixed(2) + "% (เข้าเกณฑ์ " + bracket + "%)";
        document.getElementById('resFinance').innerText = financeAmount.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท";
        document.getElementById('resRate').innerText = ratePerYear + "% ต่อปี";
        
        // แสดงผลลัพธ์ค่างวดสุทธิ พร้อมบังคับโชว์ทศนิยม 2 ตำแหน่ง
        document.getElementById('resMonthlyNoVat').innerText = monthlyPaymentNoVat.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/เดือน";
        
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
