<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGM2 Calculator - Evolution Theme</title>
    
    <!-- PWA Primary Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MGM2 Calc">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/00e5ff/000000?text=MGM2">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at top left, #0d1117, #05070a);
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .calculator-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 229, 255, 0.1), 
                        0 0 20px rgba(124, 58, 237, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Glowing accent bar at the top */
        .calculator-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00e5ff, #7c3aed, #00e5ff);
            background-size: 200% 100%;
            animation: moveGradient 4s linear infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .calculator-card h2 {
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #00e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .form-group select option {
            background-color: #0f172a;
            color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            outline: none;
            background-color: rgba(15, 23, 42, 0.9);
        }

        .btn-calc {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            font-family: inherit;
        }

        .btn-calc:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
        }

        .result-box {
            margin-top: 28px;
            padding: 22px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-left: 4px solid #00e5ff;
            border-radius: 14px;
            display: none;
            animation: fadeInEvolution 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(8px);
        }

        @keyframes fadeInEvolution {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result-box p {
            margin: 12px 0;
            color: #94a3b8;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-box span {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 15px;
        }

        .highlight {
            font-size: 16px !important;
            color: #00e5ff !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
            margin-top: 16px !important;
            font-weight: 600;
        }

        .highlight span {
            font-size: 22px !important;
            color: #00e5ff !important;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        /* PWA Center Modal Style */
        .pwa-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 10, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        .pwa-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .pwa-modal {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 20px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(0, 229, 255, 0.2), 0 0 30px rgba(124, 58, 237, 0.25);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .pwa-overlay.show .pwa-modal {
            transform: scale(1);
        }

        .pwa-modal-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 16px;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
        }

        .pwa-modal h3 {
            margin: 0 0 8px 0;
            font-size: 20px;
            color: #fff;
        }

        .pwa-modal p {
            margin: 0 0 24px 0;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .pwa-modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-modal-install {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: filter 0.2s;
        }

        .btn-modal-chrome {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-modal-close {
            background: none;
            border: none;
            color: #64748b;
            font-size: 13px;
            margin-top: 8px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>MGM2 Calculator สำหรับทีมขาย</h2>
    
    <div class="form-group">
        <label for="carPrice">ราคารถ (บาท)</label>
        <input type="number" id="carPrice" placeholder="เช่น 649900" required>
    </div>

    <div class="form-group">
        <label for="downAmount">จำนวนเงินดาวน์ (บาท)</label>
        <input type="number" id="downAmount" placeholder="เช่น 100000" required>
    </div>

    <div class="form-group">
        <label for="interestRate">อัตราดอกเบี้ยต่อปี (%)</label>
        <input type="number" id="interestRate" step="0.01" placeholder="เช่น 2.69" value="2.69" required>
    </div>

    <div class="form-group">
        <label for="termMonths">ระยะเวลาผ่อน (งวด)</label>
        <select id="termMonths">
            <option value="48">48 งวด (4 ปี)</option>
            <option value="60">60 งวด (5 ปี)</option>
            <option value="72">72 งวด (6 ปี)</option>
            <option value="84">84 งวด (7 ปี)</option>
        </select>
    </div>

    <button class="btn-calc" onclick="calculateInstallment()">คำนวณค่างวด</button>

    <div class="result-box" id="resultBox">
        <p>สัดส่วนเงินดาวน์: <span id="resDownPercent">0%</span></p>
        <p>ยอดจัดไฟแนนซ์: <span id="resFinance">0.00 บาท</span></p>
        <p>อัตราดอกเบี้ยที่ใช้: <span id="resRate">0%</span></p>
        <p class="highlight" style="display:flex; justify-content:space-between; align-items:center;">
            ค่างวด: <span id="resMonthlyNoVat">0.00 บาท</span>
        </p>
    </div>
</div>

<!-- PWA Center Modal -->
<div class="pwa-overlay" id="pwaOverlay">
    <div class="pwa-modal">
        <div class="pwa-modal-icon">MGM2</div>
        <h3>ติดตั้งแอปพลิเคชัน</h3>
        <p>ติดตั้ง MGM2 Calculator เพื่อเปิดใช้งานได้รวดเร็วทันใจ พร้อมรองรับการทำงานแบบออฟไลน์ค่ะ</p>
        <div class="pwa-modal-actions">
            <button class="btn-modal-install" id="btnInstall">ติดตั้งลงเครื่องทันที</button>
            <button class="btn-modal-close" onclick="closePwaModal()">ไว้ทีหลัง</button>
        </div>
    </div>
</div>

<script>
    function calculateInstallment() {
        const price = parseFloat(document.getElementById('carPrice').value);
        const downAmt = parseFloat(document.getElementById('downAmount').value);
        const ratePerYear = parseFloat(document.getElementById('interestRate').value);
        const termMonths = parseInt(document.getElementById('termMonths').value);

        if (isNaN(price) || price <= 0 || isNaN(downAmt) || downAmt < 0) {
            alert("คุณชินอิจิคะ กรุณาระบุราคารถและเงินดาวน์ให้ถูกต้องด้วยนะคะ 😉");
            return;
        }

        if (isNaN(ratePerYear) || ratePerYear < 0) {
            alert("คุณชินอิจิคะ กรุณาระบุอัตราดอกเบี้ยให้ถูกต้องด้วยนะคะ 😉");
            return;
        }

        if (downAmt >= price) {
            alert("เงินดาวน์ต้องน้อยกว่าราคารถสิคะคุณชินอิจิ");
            return;
        }

        let downPercentRaw = (downAmt / price) * 100;
        const financeAmount = price - downAmt;
        const years = termMonths / 12;

        const totalInterest = financeAmount * (ratePerYear / 100) * years;
        const monthlyPaymentNoVat = (financeAmount + totalInterest) / termMonths;

        document.getElementById('resDownPercent').innerText = downPercentRaw.toFixed(2) + "%";
        document.getElementById('resFinance').innerText = financeAmount.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท";
        document.getElementById('resRate').innerText = ratePerYear.toFixed(2) + "% ต่อปี";
        document.getElementById('resMonthlyNoVat').innerText = monthlyPaymentNoVat.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " บาท/เดือน";
        
        document.getElementById('resultBox').style.display = 'block';
    }

    // PWA & Center Modal Logic
    let deferredPrompt;
    const pwaOverlay = document.getElementById('pwaOverlay');
    const btnInstall = document.getElementById('btnInstall');

    // ตรวจสอบ event ก่อนติดตั้ง PWA (สำหรับ Android/Chrome)
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // เด้ง Modal ขึ้นมากลางจอทันที
        pwaOverlay.classList.add('show');
    });

    btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('User installed PWA');
            }
            deferredPrompt = null;
            pwaOverlay.classList.remove('show');
        } else {
            // สำหรับ iOS หรือ เบราว์เซอร์ที่ไม่รองรับ direct prompt
            alert("สำหรับ iPhone/iPad (Safari):\nให้กดปุ่ม 'แชร์ (Share)' ด้านล่าง แล้วเลือก 'เพิ่มไปยังหน้าจอหลัก (Add to Home Screen)' นะคะคุณชินอิจิ ✨");
        }
    });

    // ฟังก์ชันเด้งไปเปิดใน Google Chrome
    function openInChrome() {
        const currentUrl = window.location.href;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        if (isIOS) {
            const chromeUrl = currentUrl.replace(/^https?:\/\//, 'googlechromes://');
            window.location.href = chromeUrl;
        } else {
            window.location.href = currentUrl;
        }
    }

    function closePwaModal() {
        pwaOverlay.classList.remove('show');
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registered!'))
                .catch(err => console.log('SW Registration Failed:', err));
        });
    }

    // Prevent fbclid url parameter
    (function() {
        var url = new URL(window.location.href);
        if (url.searchParams.has('fbclid')) {
            url.searchParams.delete('fbclid');
            window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
        }
    })();
</script>

</body>
</html>
